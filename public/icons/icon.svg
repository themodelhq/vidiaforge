<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#16161f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#e07b1a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Play triangle formed as a film aperture -->
  <g transform="translate(256 256)">
    <!-- Outer ring -->
    <circle r="140" fill="none" stroke="url(#accent)" stroke-width="14" opacity="0.9"/>
    <!-- Play triangle -->
    <path d="M -52 -78 L 92 0 L -52 78 Z" fill="url(#accent)"/>
    <!-- Frame brackets -->
    <g stroke="url(#accent)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.75">
      <path d="M -150 -40 L -150 -90 L -100 -90"/>
      <path d="M 150 -40 L 150 -90 L 100 -90"/>
      <path d="M -150 40 L -150 90 L -100 90"/>
      <path d="M 150 40 L 150 90 L 100 90"/>
    </g>
  </g>
</svg>
