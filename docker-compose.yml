# VidiaForge — local development with Docker Compose
#
# Brings up the full local stack:
#   - postgres  (PostgreSQL 15 — replaces SQLite in production)
#   - redis     (Redis 7 — render queue + rate-limit + ephemeral state)
#   - app       (Next.js 16 standalone server, port 3000)
#   - worker    (FFmpeg render pipeline — same image, different CMD)
#
# Usage:
#   cp .env.example .env   # then fill in DATABASE_URL / REDIS_URL / secrets
#   docker compose up -d
#   docker compose logs -f app
#   docker compose down    # stop
#   docker compose down -v # stop + delete volumes (nukes postgres data)
#
# The frontend can ALSO run locally without Docker via `bun run dev` — in that
# case, point DATABASE_URL and REDIS_URL at the postgres + redis services
# exposed on the host (see ports below).

services:
  # ─── PostgreSQL 15 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: vidiaforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vidiaforge
      POSTGRES_PASSWORD: vidiaforge_dev_password  # dev only — override via .env
      POSTGRES_DB: vidiaforge
      # Tuning for local dev (small machine).
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidiaforge -d vidiaforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vidiaforge-redis
    restart: unless-stopped
    # Persist to disk every 60 seconds if at least 1 key changed.
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Next.js app (API + SSR + frontend) ───────────────────────────────────
  # Built from the project Dockerfile. Same image runs the worker (below).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidiaforge-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Use the service name (postgres/redis) for DNS resolution inside the network.
      DATABASE_URL: postgresql://vidiaforge:vidiaforge_dev_password@postgres:5432/vidiaforge?schema=public
      REDIS_URL: redis://redis:6379
      # Auth secrets — generate with `openssl rand -hex 32`.
      JWT_SECRET: dev_jwt_secret_change_me
      SESSION_SECRET: dev_session_secret_change_me
      # Local storage (the Dockerfile creates these dirs + gives nextjs user ownership).
      STORAGE_PROVIDER: local
      UPLOAD_DIR: /app/uploads
      TEMP_DIR: /app/tmp
      CACHE_DIR: /app/cache
      # AI — sandbox default.
      AI_PROVIDER: zai
      # CORS — same-origin in dev (no cross-origin calls).
      CORS_ORIGIN: "*"
      # Public env vars (browser-safe).
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: VidiaForge
      NEXT_PUBLIC_STORAGE_PUBLIC_BASE_URL: ""
    ports:
      - "3000:3000"
    volumes:
      # Persist uploaded media across container restarts.
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Worker (FFmpeg render pipeline) ──────────────────────────────────────
  # Same image as `app`, different CMD. The worker.Dockerfile is the canonical
  # image for production workers; locally we reuse the app image with an
  # overridden command for simplicity.
  worker:
    build:
      context: .
      dockerfile: worker.Dockerfile
    container_name: vidiaforge-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vidiaforge:vidiaforge_dev_password@postgres:5432/vidiaforge?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: local
      UPLOAD_DIR: /app/uploads
      TEMP_DIR: /app/tmp
      CACHE_DIR: /app/cache
      AI_PROVIDER: zai
      # Worker does not need JWT/SESSION secrets or CORS.
    volumes:
      # Share the uploads volume with the app so worker can read uploaded media.
      - uploads:/app/uploads
    # No healthcheck — workers don't expose HTTP. Use `docker compose logs worker`
    # to monitor. The worker.Dockerfile's FFmpeg verification step at build time
    # is the closest equivalent to a healthcheck.
    # Render's "worker" service type also has no HTTP health check.

# ─── Named volumes ────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  uploads:
    driver: local
